packages:
  - 'apps/*'
  - 'packages/*'
  # apps/mobile est un projet Flutter/Dart (ADR-001) : il n'a pas de package.json
  # et ne fait jamais partie du workspace pnpm. Propriété de FM-01.
  - '!apps/mobile'
allowBuilds:
  # esbuild (dépendance de tsx) télécharge le binaire natif de sa plateforme au postinstall —
  # script légitime, nécessaire pour que `tsx` fonctionne.
  esbuild: true
  # prisma / @prisma/client / @prisma/engines téléchargent au postinstall les binaires natifs
  # du moteur de requête Prisma (query-engine) pour la plateforme courante — script légitime,
  # nécessaire pour `prisma generate`/`migrate`/`studio` (BE-01).
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # argon2 (node-argon2) télécharge/compile son binaire natif au postinstall — script légitime,
  # nécessaire pour le hachage Argon2id de l'OTP (BE-07).
  argon2: true
minimumReleaseAgeExclude:
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - vitest@4.1.11
