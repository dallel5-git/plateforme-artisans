name: sanaya
description: "Sanaya — mise en relation particuliers/artisans (Sahel, Tunisie)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.24.0'

dependencies:
  # FM-02b : dépendances du client Dio/built_value généré (BE-26), fusionné dans l'app sous
  # lib/core/api/generated/ — voir tooling/scripts/mobile-client.mjs
  # (PINNED_GENERATOR_DEPENDENCIES/foldIntoApp). Versions exactes, pas des ranges : doivent
  # matcher ce que la génération a réellement produit, sinon le code généré (built_value) et la
  # version réellement bundlée par l'app peuvent diverger silencieusement.
  built_collection: 5.1.1
  built_value: 8.12.7
  cupertino_icons: ^1.0.8
  dio: 5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.0
  go_router: ^17.5.0
  intl: ^0.20.2
  one_of: 1.5.0
  one_of_serializer: 1.5.0
  shared_preferences: ^2.5.5
  slang: ^4.19.0
  slang_flutter: ^4.19.0

# flutter_lints + very_good_analysis : voir analysis_options.yaml — un seul
# `include` (very_good_analysis, superset strict) suffit, les deux packages
# restent en dev_dependencies pour respecter le périmètre de l'issue FM-01.
dev_dependencies:
  build_runner: ^2.15.1
  # FM-02b : build_runner ci-dessus est déjà requis par slang_build_runner (FM-03) — réutilisé
  # tel quel pour le client généré, qui n'a besoin que de built_value_generator en plus.
  built_value_generator: ">=8.4.0 <9.0.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  slang_build_runner: ^4.19.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # Polices variables (un seul fichier par famille, axe wght) — noms de
  # famille alignés strictement sur AppText.latinFamily/arabicFamily
  # (lib/core/theme/app_text.dart, généré SO-04). Les 4 poids déclarés sont
  # ceux réellement utilisés par AppText (400/600/700/800) ; Flutter/Skia
  # interpole sur l'axe wght du fichier variable pour chacun.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
          weight: 400
        - asset: assets/fonts/Manrope[wght].ttf
          weight: 600
        - asset: assets/fonts/Manrope[wght].ttf
          weight: 700
        - asset: assets/fonts/Manrope[wght].ttf
          weight: 800
    - family: Noto Kufi Arabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic[wght].ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic[wght].ttf
          weight: 600
        - asset: assets/fonts/NotoKufiArabic[wght].ttf
          weight: 700
        - asset: assets/fonts/NotoKufiArabic[wght].ttf
          weight: 800
