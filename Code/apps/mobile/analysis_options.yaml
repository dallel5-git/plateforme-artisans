# very_good_analysis est un superset strict de flutter_lints : un seul
# `include` suffit (flutter_lints reste en dev_dependencies pour respecter
# la lettre de l'issue FM-01, mais n'est pas inclus séparément ici).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - test/features/contact/contact_flow_test.dart
    # FM-09/FM-02 : test pré-écrit qui échoue tant que lib/features/contact/
    # et le wiring de sanaya_api_client n'existent pas — voulu (cf. l'entête
    # du fichier). Exclu de l'analyse, pas supprimé. Retirer cette ligne
    # quand FM-02/FM-09 livrent le code testé.
    - lib/core/theme/app_colors.dart
    - lib/core/theme/app_spacing.dart
    - lib/core/theme/app_text.dart
    # SO-04 : générés depuis packages/design-tokens/tokens.json, jamais
    # édités à la main (écrasés au prochain `pnpm tokens:build`). Même
    # précédent que le job CI mobile-client-check, qui tolère déjà les
    # warnings du générateur de client API pour la même raison. Retirer si
    # le générateur SO-04 est un jour rendu conforme very_good_analysis.
    - lib/core/api/generated/**
    # BE-26 : paquet Dart autonome (son propre pubspec.yaml), déjà analysé
    # séparément par le job CI mobile-client-check (avec son propre `pub
    # get` scopé). Sans ce `pub get`, cette arborescence n'a pas de
    # `.dart_tool/package_config.json` : `flutter analyze` à la racine
    # d'apps/mobile la traite quand même mais résout ses imports
    # (built_value, built_collection…) au hasard plutôt que via le
    # pubspec.lock du sous-paquet, et produit des centaines de fausses
    # erreurs "undefined name" — reproductible uniquement sur un checkout
    # propre (un `.dart_tool` local préexistant masque le problème).

linter:
  rules:
    # Pertinent pour un package pub.dev publié, punitif pour du code d'app
    # où (presque) tout est effectivement privé à l'app — sinon "zéro
    # warning" devient "docstring obligatoire sur chaque widget".
    public_member_api_docs: false
