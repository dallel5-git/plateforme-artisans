name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Code

jobs:
  static-checks:
    name: lint · typecheck · format · contrat · tokens
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Valeurs factices — apps/api/src/env.ts exige des URL valides même sans base
      # vivante : générer le contrat OpenAPI ne fait aucune I/O réseau au boot.
      DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup lit package.json à la racine du dépôt, pas dans Code/
          # (`defaults.run.working-directory` ne s'applique qu'aux étapes `run:`) —
          # on épingle donc explicitement la version, alignée sur le champ
          # `packageManager` de Code/package.json.
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Code/pnpm-lock.yaml

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Code/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      # @prisma/client n'exporte les enums/types du schéma qu'après `generate` — sans cette
      # étape, `pnpm typecheck` échoue dès que packages/db/src importe un type généré (BE-05).
      - run: pnpm --filter @repo/db generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm api:contract:check
      - run: pnpm tokens:build:check
      - run: pnpm web:client:check
      - run: pnpm i18n:check

  mobile-analyze:
    name: mobile — flutter analyze · dart format · test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: Code/apps/mobile
    steps:
      - uses: actions/checkout@v5

      # Épinglé sur une version précise (pas "stable") — même raison que
      # dart-lang/setup-dart dans mobile-client-check : un canal mobile "stable" peut
      # faire varier le comportement de l'analyzer d'une exécution à l'autre.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - run: flutter pub get

      # Contrairement à mobile-client-check (qui tolère les avertissements du
      # générateur de client API), ce job utilise le code de sortie natif de
      # `flutter analyze`, qui échoue déjà sur avertissement ET erreur — c'est
      # exactement le critère d'acceptation de FM-01 ("flutter analyze : zéro
      # warning"). Les fichiers générés SO-04 (lib/core/theme/**) et le test FM-09
      # pré-écrit sont exclus via analysis_options.yaml, pas ici.
      - run: flutter analyze

      # Ciblé sur les répertoires réellement écrits à la main, pas `dart format .`
      # sur tout l'arbre : lib/core/theme/** (généré SO-04) et
      # test/features/contact/contact_flow_test.dart (pré-écrit FM-09) ne passent
      # pas `dart format` tel quel et ne sont pas à nous de reformater — même
      # raison que l'exclusion analyzer ci-dessus. À élargir au fil des tickets
      # FM-* qui ajoutent du code sous lib/core/{api,i18n,widgets}/ et
      # lib/features/.
      - run: dart format --set-exit-if-changed lib/app lib/main.dart test/widget_test.dart

      # FM-03 : lib/core/i18n/*.g.dart est généré par slang depuis
      # packages/i18n/src/locales/ (SO-05). `dart run build_runner build`
      # ne fonctionne PAS ici — son graphe d'assets ne voit pas les fichiers
      # hors du package (input_directory pointe sur ../../packages/i18n/…) ;
      # seule la CLI `dart run slang` fait de l'I/O disque direct. Un
      # checkout CI est toujours propre : régénérer puis `git diff
      # --exit-code` prouve que le code committé est à jour, même principe
      # que tokens:build:check/mobile:client:check côté TS.
      - run: dart run slang
      - run: git diff --exit-code -- lib/core/i18n

      # Ciblé sur test/widget_test.dart, pas un `flutter test` général : le test
      # test/features/contact/contact_flow_test.dart est du code FM-09/FM-02
      # pré-écrit qui ne compile pas encore (imports vers du code qui n'existe pas
      # encore) — voulu, cf. son en-tête. Un `flutter test` sans filtre le
      # découvrirait quand même (l'exclusion analyzer n'affecte que l'analyse
      # statique, pas la collecte des tests) et ferait échouer ce job pour une
      # raison sans rapport avec le code de la PR. À élargir quand FM-02/FM-09
      # livrent le code testé.
      - run: flutter test test/widget_test.dart

  mobile-client-check:
    name: contrat → client Dart (mobile:client)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Code/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Épinglé (comme Node/pnpm/Java ci-dessus) — un canal "stable" mobile peut faire varier le
      # comportement de l'analyzer sur le code généré (`built_value`) d'une exécution à l'autre.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Code/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:client:check
      # `mobile:client:check` régénère dans un dossier TEMPORAIRE pour le diff — il ne lance
      # jamais `pub get` dans `apps/mobile/lib/core/api/generated/` lui-même. Sans ça,
      # `dart analyze` ci-dessous n'a pas de `.dart_tool/package_config.json` et résout les
      # paquets au hasard plutôt que via `pubspec.lock` committé.
      - run: dart pub get
        working-directory: Code/apps/mobile/lib/core/api/generated
      # `dart analyze` sort en code non-zéro dès qu'il y a des WARNINGS, pas seulement des
      # erreurs — le générateur en produit toujours (imports défensifs non utilisés, cf.
      # description de la PR). On échoue seulement s'il y a une vraie ligne "error -".
      - name: dart analyze (échoue uniquement sur une erreur, pas un avertissement)
        working-directory: Code/apps/mobile/lib/core/api/generated
        run: |
          dart analyze > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ *error - ' analyze.log; then
            echo "::error::dart analyze a trouvé au moins une erreur (voir le log ci-dessus)."
            exit 1
          fi
          echo "✓ dart analyze : 0 erreur"

  test:
    name: test (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: sanaya
          POSTGRES_PASSWORD: sanaya_dev_password
          POSTGRES_DB: sanaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanaya -d sanaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      # QA-01a : requis par `prisma migrate deploy` (schema.prisma déclare `directUrl`, jamais
      # utilisé par le client Prisma lui-même — seulement par les commandes migrate). Sans
      # pooler devant ce Postgres de service, même valeur que DATABASE_URL (voir .env.example).
      DIRECT_DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup lit package.json à la racine du dépôt, pas dans Code/
          # (`defaults.run.working-directory` ne s'applique qu'aux étapes `run:`) —
          # on épingle donc explicitement la version, alignée sur le champ
          # `packageManager` de Code/package.json.
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Code/pnpm-lock.yaml

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Code/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db generate
      # QA-01a (absorbe BE-02b) : sans cette étape, le schéma n'existe jamais sur le Postgres de
      # service — les tests d'intégration (apps/api, packages/db) qui touchent réellement la base
      # échouaient en silence côté CI (gap documenté dans 5 fichiers de tests avant ce ticket).
      - run: pnpm --filter @repo/db migrate:deploy
      - run: pnpm test
