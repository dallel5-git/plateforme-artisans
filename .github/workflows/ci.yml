name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Code

jobs:
  static-checks:
    name: lint · typecheck · format · contrat · tokens
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Valeurs factices — apps/api/src/env.ts exige des URL valides même sans base
      # vivante : générer le contrat OpenAPI ne fait aucune I/O réseau au boot.
      DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup lit package.json à la racine du dépôt, pas dans Code/
          # (`defaults.run.working-directory` ne s'applique qu'aux étapes `run:`) —
          # on épingle donc explicitement la version, alignée sur le champ
          # `packageManager` de Code/package.json.
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Code/pnpm-lock.yaml

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Code/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      # @prisma/client n'exporte les enums/types du schéma qu'après `generate` — sans cette
      # étape, `pnpm typecheck` échoue dès que packages/db/src importe un type généré (BE-05).
      - run: pnpm --filter @repo/db generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm api:contract:check
      - run: pnpm tokens:build:check
      - run: pnpm web:client:check
      - run: pnpm i18n:check

  mobile-analyze:
    name: mobile — flutter analyze · dart format · test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: Code/apps/mobile
    steps:
      - uses: actions/checkout@v5

      # Épinglé sur une version précise (pas "stable") — même raison que
      # dart-lang/setup-dart dans mobile-client-check : un canal mobile "stable" peut
      # faire varier le comportement de l'analyzer d'une exécution à l'autre.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - run: flutter pub get

      # Contrairement à mobile-client-check (qui tolère les avertissements du
      # générateur de client API), ce job utilise le code de sortie natif de
      # `flutter analyze`, qui échoue déjà sur avertissement ET erreur — c'est
      # exactement le critère d'acceptation de FM-01 ("flutter analyze : zéro
      # warning"). Les fichiers générés SO-04 (lib/core/theme/**) et le test FM-09
      # pré-écrit sont exclus via analysis_options.yaml, pas ici.
      - run: flutter analyze

      # lib/core/api/generated/ est exclu de `flutter analyze` ci-dessus (voir
      # analysis_options.yaml) — le générateur produit toujours quelques avertissements
      # (imports défensifs non utilisés) qu'on tolère, mais une vraie erreur de compilation
      # doit quand même faire échouer la CI. FM-02b : ce sous-arbre fait désormais partie du
      # package de l'app (plus de pub get séparé, cf. mobile-client-check), `flutter pub get`
      # ci-dessus suffit à lui donner un `.dart_tool/package_config.json` valide.
      - name: dart analyze sur lib/core/api/generated (échoue uniquement sur une erreur)
        run: |
          dart analyze lib/core/api/generated > analyze-generated.log 2>&1 || true
          cat analyze-generated.log
          if grep -q '^ *error - ' analyze-generated.log; then
            echo "::error::dart analyze a trouvé au moins une erreur dans lib/core/api/generated (voir le log ci-dessus)."
            exit 1
          fi
          echo "✓ dart analyze (lib/core/api/generated) : 0 erreur"

      # Ciblé sur les répertoires réellement écrits à la main, pas `dart format .`
      # sur tout l'arbre : lib/core/theme/** (généré SO-04) ne passe pas
      # `dart format` tel quel et n'est pas à nous de reformater — même
      # raison que l'exclusion analyzer ci-dessus. lib/core/widgets et
      # test/core/widgets ajoutés par FM-04 ; lib/core/api/api_client_provider.dart
      # et lib/features/search (FM-06) ajoutés ici — premier code applicatif sous
      # ces deux chemins. lib/features/contact et test/features/contact/data
      # ajoutés par FM-09a ; test/features/contact/contact_flow_test.dart
      # ajouté par FM-09b (remplace le spec pré-écrit qui restait seul, exclu,
      # dans ce dossier — voir le commit FM-09b pour le détail du contrat réel
      # découvert entre-temps). lib/core/api/auth_token_store.dart et
      # lib/core/api/interceptors/{auth,retry}_interceptor.dart + test/core/api
      # ajoutés par FM-02d (auth/refresh single-flight) et FM-02e (retry
      # GET, backoff). ⚠️
      # Fichier précis, jamais `lib/core/api` en entier : ce dossier contient
      # aussi `lib/core/api/generated/` (client openapi-generator, SDK Dart
      # 3.12.2 épinglé côté mobile-client-check) — un `dart format` avec un
      # SDK local/CI différent le reformaterait en diff parasite, même bug
      # que celui documenté pour mobile-client-check (vécu ici : premier
      # essai de cette PR incluait `lib/core/api` en entier, CI rouge).
      # test/core/i18n (FM-03) n'est pas encore couvert ici — gap pré-existant,
      # indépendant de FM-04/FM-06, loggé dans backlog/TODO.md § Backlog non
      # planifié. À élargir au fil des tickets FM-* suivants. FM-09c ajoute
      # lib/features/contact/presentation et test/features/contact/{application,
      # presentation} — déjà couverts, les deux chemins listés ci-dessus
      # étant des répertoires entiers.
      - run: |
          dart format --set-exit-if-changed \
            lib/app lib/main.dart lib/core/widgets lib/core/api/api_client_provider.dart \
            lib/core/api/auth_token_store.dart lib/core/api/interceptors \
            lib/features/search lib/features/contact lib/features/provider_profile \
            lib/features/onboarding \
            test/widget_test.dart test/core/widgets test/features/search test/features/contact \
            test/features/provider_profile test/core/api test/features/onboarding

      # FM-03 : lib/core/i18n/*.g.dart est généré par slang depuis
      # packages/i18n/src/locales/ (SO-05). `dart run build_runner build`
      # ne fonctionne PAS ici — son graphe d'assets ne voit pas les fichiers
      # hors du package (input_directory pointe sur ../../packages/i18n/…) ;
      # seule la CLI `dart run slang` fait de l'I/O disque direct. Un
      # checkout CI est toujours propre : régénérer puis `git diff
      # --exit-code` prouve que le code committé est à jour, même principe
      # que tokens:build:check/mobile:client:check côté TS.
      - run: dart run slang
      - run: git diff --exit-code -- lib/core/i18n

      # Ciblé sur des chemins précis, pas un `flutter test` général : le test
      # test/features/contact/contact_flow_test.dart pré-écrit (FM-09) a été
      # remplacé par FM-09b, plus rien à exclure ici pour cette raison.
      # test/core/widgets ajouté par FM-04 ; test/features/search ajouté par
      # FM-06 (FM-06a n'avait pas étendu cette liste — corrigé ici) ;
      # test/features/contact/data ajouté par FM-09a. test/features/contact
      # (dossier entier, dont contact_flow_test.dart) ajouté par FM-09b : le
      # spec pré-écrit qui y restait seul et exclu a été remplacé par une
      # version conforme au vrai contrat `ContactEventsApi`/`ContactService`.
      # test/features/provider_profile ajouté par FM-08 ; test/core/api par
      # FM-02c/d.
      #
      # FM-02d : une seule invocation avec plusieurs cibles mélangées
      # (fichier(s) + répertoire(s)) est peu fiable — observé reproductible
      # localement (des tests d'un répertoire silencieusement non exécutés
      # selon le mélange exact des arguments, sans erreur ni avertissement,
      # y compris dans cette liste avant ce commit). Une invocation séparée
      # par cible est le seul comportement vérifié fiable.
      - run: flutter test test/widget_test.dart
      - run: flutter test test/core/widgets
      - run: flutter test test/core/api
      - run: flutter test test/features/search
      - run: flutter test test/features/contact
      - run: flutter test test/features/provider_profile
      # FM-11a : une invocation séparée par cible (règle FM-02d — mélange fichier+répertoire peu fiable).
      - run: flutter test test/features/onboarding

  mobile-client-check:
    name: contrat → client Dart (mobile:client)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Code/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Épinglé (comme Node/pnpm/Java ci-dessus) — mobile-client.mjs lance lui-même `dart pub
      # get`/`build_runner`/`dart format` sur le client généré (avant fusion dans l'app) ; un
      # SDK Dart différent en local vs CI peut résoudre une version différente de
      # built_value_generator (aucune borne exacte, seulement `>=8.4.0 <9.0.0`) et produire un
      # `dart format` différent — les deux font échouer `mobile:client:check` sur un diff qui
      # n'a rien à voir avec le contrat lui-même (vécu : PR #153/BE-26c).
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Code/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:client:check
      # FM-02b : lib/core/api/generated/ n'est plus un package pub autonome (fusionné dans
      # l'app `sanaya`, cf. mobile-client.mjs/foldIntoApp) — son analyse d'erreurs vit
      # désormais dans le job mobile-analyze (qui a déjà flutter pub get sur l'app entière),
      # pas ici. Ce job ne fait plus que garder le contrat/client synchronisés.

  test:
    name: test (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: sanaya
          POSTGRES_PASSWORD: sanaya_dev_password
          POSTGRES_DB: sanaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanaya -d sanaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      # QA-01a : requis par `prisma migrate deploy` (schema.prisma déclare `directUrl`, jamais
      # utilisé par le client Prisma lui-même — seulement par les commandes migrate). Sans
      # pooler devant ce Postgres de service, même valeur que DATABASE_URL (voir .env.example).
      DIRECT_DATABASE_URL: postgresql://sanaya:sanaya_dev_password@localhost:5432/sanaya
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup lit package.json à la racine du dépôt, pas dans Code/
          # (`defaults.run.working-directory` ne s'applique qu'aux étapes `run:`) —
          # on épingle donc explicitement la version, alignée sur le champ
          # `packageManager` de Code/package.json.
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Code/pnpm-lock.yaml

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Code/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db generate
      # QA-01a (absorbe BE-02b) : sans cette étape, le schéma n'existe jamais sur le Postgres de
      # service — les tests d'intégration (apps/api, packages/db) qui touchent réellement la base
      # échouaient en silence côté CI (gap documenté dans 5 fichiers de tests avant ce ticket).
      - run: pnpm --filter @repo/db migrate:deploy
      - run: pnpm test
